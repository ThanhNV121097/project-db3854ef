<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World</title>
  <style>
    :root{
      --bg:#f8fafc;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --line:#e2e8f0;
      --accent:#2563eb;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top, rgba(37,99,235,.08), transparent 36%),
        linear-gradient(180deg, #fff 0%, var(--bg) 100%);
    }
    .shell{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:32px 20px;
    }
    .card{
      width:min(760px,100%);
      background:rgba(255,255,255,.82);
      border:1px solid rgba(226,232,240,.9);
      border-radius:28px;
      box-shadow:0 24px 80px rgba(15,23,42,.08);
      backdrop-filter:blur(10px);
      text-align:center;
      padding:clamp(32px,7vw,72px) 24px;
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 14px;
      border:1px solid var(--line);
      border-radius:999px;
      color:var(--muted);
      font-size:14px;
      letter-spacing:.02em;
      background:#fff;
    }
    .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px rgba(37,99,235,.12)}
    h1{
      margin:24px 0 12px;
      font-size:clamp(3.25rem,12vw,7rem);
      line-height:.95;
      letter-spacing:-.06em;
      color:var(--text);
    }
    p{
      margin:0 auto;
      max-width:34rem;
      font-size:clamp(1rem,2.2vw,1.125rem);
      line-height:1.7;
      color:var(--muted);
    }
    .footer{
      margin-top:28px;
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .pill{
      border:1px solid var(--line);
      background:#fff;
      color:#334155;
      border-radius:999px;
      padding:10px 14px;
      font-size:14px;
    }
    @media (max-width: 480px){
      .card{border-radius:22px;padding-inline:18px}
      .eyebrow{font-size:13px}
    }
    :focus-visible{outline:3px solid rgba(37,99,235,.45);outline-offset:3px}
  </style>
</head>
<body>
  <main class="shell" aria-labelledby="title">
    <section class="card">
      <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Minimal static page</div>
      <h1 id="title">Hello, World!</h1>
      <p>One clean screen. No login. No database. No extra sections. Just a friendly greeting centered on the page.</p>
      <div class="footer" aria-hidden="true">
        <span class="pill">Responsive</span>
        <span class="pill">Static</span>
        <span class="pill">Zero motion</span>
      </div>
    </section>
  </main>
</body>
</html>
